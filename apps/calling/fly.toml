# ─── Fly.io Configuration ─────────────────────────────────────────
# Calling Service – Autonomous AI Voice Engine
# Region: bom (Mumbai) for low-latency Indian voice calls

app = "folio-calling"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  # Build context is the monorepo root (two levels up)
  # Fly CLI must be run from the repo root with: fly deploy --config apps/calling/fly.toml

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
